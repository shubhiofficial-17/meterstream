name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env: { POSTGRES_USER: meter, POSTGRES_PASSWORD: meter, POSTGRES_DB: meter }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U meter" --health-interval 5s --health-retries 20
    env:
      REDIS_TEST_URL: redis://localhost:6379/0
      TIMESCALE_TEST_URL: postgresql://meter:meter@localhost:5432/meter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit + integration tests (Redis, TimescaleDB)
        run: pytest -q
      - name: Detector quality gate (500 meters x 7 days)
        run: python -m eval.evaluate_detectors --meters 500 --days 7 --min-f1 0.95 --report eval-report.json
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: eval-report.json }

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meterstream:ci .
      - name: Smoke test the API container
        run: |
          docker run -d --name api -p 8000:8000 meterstream:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/health && curl -sf localhost:8000/api/summary && exit 0; sleep 1; done
          docker logs api; exit 1

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
