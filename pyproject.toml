[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meterstream"
version = "0.1.0"
description = "Real-time smart-meter data platform: streaming ingest, anomaly and tamper detection, time-series storage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
meterstream = "meterstream.cli:main"

[tool.setuptools.packages.find]
include = ["meterstream*"]

[tool.setuptools.package-data]
meterstream = ["dashboard.html"]
"meterstream.storage" = ["schema.sql", "schema_tsl.sql"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
